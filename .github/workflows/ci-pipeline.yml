name: Python Docker Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  # 1. First Job: Security Scan (The Gatekeeper)
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Important: Gitleaks needs the full history

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. Second Job: Docker Build
  build:
    needs: security-scan # CRITICAL: This stops the build if secrets are found!
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build the Docker Image
        run: docker build -t ads-app:latest .
